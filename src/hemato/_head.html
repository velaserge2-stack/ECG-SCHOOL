<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>@@TITLE@@</title>
<meta name="description" content="@@DESC@@">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F1F4F4;--panel:#FFFFFF;--fg:#16211F;--muted:#586966;--line:#D5DEDC;--vec:#0A7C76;--vecSoft:rgba(10,124,118,.14);
 --blood:#B23A3A;--bloodSoft:rgba(178,58,58,.16);--guess:#C2480F;--guessSoft:rgba(194,72,15,.14);--slate:#4A5D8A;--good:#2A7A35;--bad:#B3261E;
 --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1514;--panel:#142120;--fg:#E5EFEC;--muted:#98ADA8;--line:#2A3C39;--vec:#3FD0C6;--vecSoft:rgba(63,208,198,.16);
 --blood:#E27A7A;--bloodSoft:rgba(226,122,122,.2);--guess:#FF9A5C;--guessSoft:rgba(255,154,92,.16);--slate:#9DB2E8;--good:#6FD07C;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1514;--panel:#142120;--fg:#E5EFEC;--muted:#98ADA8;--line:#2A3C39;--vec:#3FD0C6;--vecSoft:rgba(63,208,198,.16);
 --blood:#E27A7A;--bloodSoft:rgba(226,122,122,.2);--guess:#FF9A5C;--guessSoft:rgba(255,154,92,.16);--slate:#9DB2E8;--good:#6FD07C;--bad:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:20px}.wrap>*{min-width:0}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance}h1{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:700;letter-spacing:-.01em}h2{font-size:1.25rem}h3{font-size:1rem}
p{margin:0}.lede{max-width:64ch;color:var(--muted)}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--vec)}
.tags{display:flex;flex-wrap:wrap;gap:6px 8px;font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}.tags span{border:1px solid var(--line);padding:2px 8px;border-radius:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
label.ctl{display:flex;flex-direction:column;gap:2px;font-size:.85rem;color:var(--muted);min-width:0}
input[type=range]{width:100%;accent-color:var(--vec)}
select{font:600 .92rem var(--font-body);padding:7px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--fg);max-width:100%}
.btn{font:600 .9rem var(--font-body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--vec)}.btn[aria-pressed="true"]{border-color:var(--vec);background:var(--vecSoft)}.btn.primary{background:var(--vec);color:var(--bg);border-color:var(--vec)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--vec);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:3px 8px;display:flex;gap:6px;align-items:baseline;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}.chip.ok{border-color:var(--good)}.chip.no{border-color:var(--bad)}.chip.wn{border-color:var(--guess)}
.chip em{font-style:normal;font-size:.72rem}.chip.ok em{color:var(--good)}.chip.no em{color:var(--bad)}.chip.wn em{color:var(--guess)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}.note{font-size:.85rem;color:var(--muted)}
.why{border-left:3px solid var(--vec);padding:6px 10px;background:var(--vecSoft);font-size:.92rem}
.warn{border-left:3px solid var(--guess);padding:6px 10px;background:var(--guessSoft);font-size:.9rem}
.formula{font:600 clamp(.92rem,2vw,1.08rem) var(--font-mono);background:var(--bg);border:1px solid var(--line);padding:10px 12px;border-radius:5px;text-align:center;overflow-wrap:anywhere}
.ver{font-family:var(--font-mono);font-size:.68rem;color:var(--guess);border:1px solid var(--guess);border-radius:3px;padding:0 4px;white-space:nowrap}
.ok{color:var(--good)}.no{color:var(--bad)}.fb{font-size:.92rem;min-height:2.6em}
canvas{display:block;max-width:100%}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-weight:600;color:var(--muted);white-space:nowrap}
td.n{white-space:nowrap;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
ul,ol{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:.92rem}legend{font-size:.95rem;padding:0;margin-bottom:6px}
.opt{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.steps{display:flex;flex-direction:column;gap:8px;counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;padding:6px 10px 6px 36px;position:relative;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.steps li::before{content:counter(s);position:absolute;left:8px;top:7px;width:20px;height:20px;border-radius:50%;background:var(--vec);color:var(--bg);font:700 .72rem var(--font-mono);display:flex;align-items:center;justify-content:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}.sw{display:inline-block;width:12px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
footer{border-top:1px solid var(--line);padding-top:14px;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
.cstep{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}.cstep.done{background:var(--panel)}
.cbtn.right{border-color:var(--good);background:rgba(42,122,53,.12)}.cbtn.wrong{border-color:var(--bad);background:rgba(179,38,30,.1)}.cbtn:disabled{cursor:default;opacity:1}
.mfc{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;min-height:44px}
.mfc:hover{border-color:var(--vec)}.mfq{font-weight:600}.mfa{border-top:1px dashed var(--line);padding-top:6px}
.mfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}.chain span{border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:var(--bg)}.chain i{font-style:normal;color:var(--muted)}
.chain span.on{border-color:var(--vec);background:var(--vecSoft)}.chain span.bad{border-color:var(--bad);background:rgba(179,38,30,.1)}
@@CSS@@
</style></head><body>
